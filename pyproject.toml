[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-input-sanitize"
version = "0.1.0"
description = "Zero-dependency input sanitization for HTTP, shell, SQL, filenames, logs, and JSONPath. Stdlib only."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Hussain AlSaibai", email = "hussain.alsaibai@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["tiny_input_sanitize"]
